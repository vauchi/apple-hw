# GitLab CI for vauchi-apple-hw, the hardware shell (ADR-077).
#
# Docs and licensing gates from the shared templates, and the Swift
# package's build and tests on the macOS runners.

workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # A merge must not cancel a main pipeline other repos wait on (VCI05).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      auto_cancel:
        on_new_commit: none
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  interruptible: true

include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.11.17
    file:
      - '/ci-templates/lint-docs.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/github-mirror.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.11.17"

stages:
  - lint
  - build
  - test

# Compiles for both SDKs; nothing runs, so no simulator boots.
build:swift:
  stage: build
  tags: [macos-host, self-hosted]
  parallel:
    matrix:
      - SDK: macosx
        TRIPLE: arm64-apple-macosx14.0
      - SDK: iphonesimulator
        TRIPLE: arm64-apple-ios15.0-simulator
  script:
    - build_sdk=$(xcrun --sdk "$SDK" --show-sdk-path)
    - swift build --sdk "$build_sdk" --triple "$TRIPLE" --scratch-path ".build/$SDK"
  timeout: 10m

# ADR-077 D-7: each port runs against a fake OS backend, and every command
# it takes and event it reports passes the contract's schema
# (VauchiContract's ContractJSON).
contract:replay:
  stage: test
  needs: []
  tags: [macos-tart, self-hosted]
  image: vauchi-macos-ci-tools
  variables:
    TART_EXECUTOR_ALWAYS_PULL: "false"
  script:
    - swiftformat . --lint
    - swiftlint lint --strict --quiet
    - swift test --scratch-path .build/tests
  timeout: 10m

github-mirror:
  extends: .github-mirror
